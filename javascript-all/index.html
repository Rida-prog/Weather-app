<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name Here!" class="search-box" spellcheck="false">
            <button class="search-button">
                <img src="/javascript-all/loupe.png" alt="search-icon">
            </button>
        </div>
        <div class="weather">
            <img src="/javascript-all/10d@2x.png" class="weather-icon">
            <h1 class="temperature">25°C</h1>
            <h3 class="city-name">Islamabad</h3>
            <div class="details">
                <div class="column">
                    <img src="/javascript-all/11338191.png" class="humidity">
                    <p class="humidity">60%</p>
                    <p>Humidity</p>
                </div>
                <div class="column">
                <img src="/javascript-all/pngtree-vector-wind-icon-png-image_3981793.jpg" class="wind">
                <p class="wind">15 km/h</p>
                <p>Wind Speed</p>
            </div>
            </div>
           
        </div>
    </div>
</body>
</html>
