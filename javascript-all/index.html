<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter City Name Here!" class="search-box" spellcheck="false">
            <button class="search-button">
                <img src="search.png" alt="search-icon">
            </button>
        </div>
        <div class="error">
            <p class="error-message">City Not Found⚠️</p>
        </div>
        <div class="weather">
            <img src="rain.png" class="weather-icon">
            <h1 class="temperature">25°C</h1>
            <h3 class="city-name">Islamabad</h3>
            <div class="details">
                <div class="column">
                    <img src="humidity.png" class="humidity-icon">
                    <p class="humidity-value">60%</p>
                    <p>Humidity</p>
                </div>
                <div class="column">
                <img src="wind.jpg" class="wind-icon">
                <p class="wind-value">15 km/h</p>
                <p>Wind Speed</p>
            </div>
            </div>
           
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
